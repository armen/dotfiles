# A vim pane gets the key and moves its own split, or asks tmux for the next pane
# when the split is at the edge. Any other pane must not get it: C-j is enter, C-h
# backspace, C-k kill line, C-l clear. ps and not pane_current_command, because vim
# is often a child of the command the pane started with.
%hidden is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
# With nothing to the right, C-l clears the screen as it does outside tmux, so the
# right edge does not wrap round to the first pane.
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'if -F "#{pane_at_right}" "send-keys C-l" "select-pane -R"'
# Copy mode reads its own table, and no vim reads the keyboard then.
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
