bind-key -r h previous-window
bind-key -r l next-window
bind-key j new-window -c '#{pane_current_path}'
# A name you type stays: allow-rename off stops the escape that zsh and vim send,
# and tmux-session saves the option, so a restore keeps it. An empty answer gives
# the window back to its command, which is what htop needs. The test reads the name
# from tmux, so a colon or a brace in it cannot break the parse.
bind-key k command-prompt -I "#W" -p "(rename-window):" "rename-window '%1' ; if -F '#{==:#{window_name},}' 'set -wu allow-rename ; set -w automatic-rename on' 'set -w allow-rename off ; set -w automatic-rename off'"
# The name of a pane goes in an option and not in its title, because a program that
# runs there owns the title. An empty answer clears it.
# The border line costs a row, so a window shows it only while it holds a split and a
# named pane. #{P:...} joins the option over the panes of a window, so tmux answers
# that itself and no shell runs; tmux-session asks for the same hook after a restore.
%hidden border_rule="#{&&:#{>:#{window_panes},1},#{P:#{@pane_name}}}"
%hidden border_apply="if -F \"$border_rule\" 'set -w pane-border-status top' 'set -wu pane-border-status'"
bind-key K command-prompt -I "#{@pane_name}" -p "(rename-pane):" "set -p @pane_name '%1' ; $border_apply"
# A pane with no name falls back to its command, as automatic-rename-format does for
# a window. The title is no help: it holds the hostname until a program writes it.
set-option -g pane-border-format "#{?pane_active,#[reverse],}#{pane_index}#[default] #{?@pane_name,#{@pane_name},#{?pane_in_mode,[tmux],#{pane_current_command}}#{?pane_dead,[dead],}}"

# Which window needs the line changes with every pane added or removed.
set-hook -g after-split-window "$border_apply"
set-hook -g after-kill-pane "$border_apply"
set-hook -g pane-exited "$border_apply"
set-hook -g pane-died "$border_apply"

